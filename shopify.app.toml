# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
#
# Linked to the "Pipeline-Aware Forecast" app in the owner's Shopify Dev Dashboard (client_id is public).
# application_url and redirect_urls point at the production deployment on Railway. `shopify app dev` swaps in
# its tunnel URL for local development (automatically_update_urls_on_dev below) and does not change this file
# unless you answer yes to updating the app URLs.

client_id = "52046dbad7458cb15922770025fa6ca8"
name = "Pipeline-Aware Forecast"
application_url = "https://pipeline-aware-forecast-production.up.railway.app"
embedded = true

[access_scopes]
# Read-only.
scopes = "read_inventory,read_locations,read_orders,read_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://pipeline-aware-forecast-production.up.railway.app/auth/callback" ]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request"]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/redact"]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = ["shop/redact"]
  uri = "/webhooks/shop/redact"

[build]
automatically_update_urls_on_dev = true
