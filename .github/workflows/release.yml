name: Release

# Runs only when a version tag (vX.Y.Z) is pushed. The tag must match package.json, the tests and the
# build must pass, then a GitHub release with auto-generated notes is created.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag must match package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
        env:
          DATABASE_URL: postgresql://unused@localhost:5432/unused
      - run: npm run build
        env:
          DATABASE_URL: postgresql://unused@localhost:5432/unused
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
